services:
  postgres:
    image: postgres:16-alpine
    container_name: campusdesk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusdesk
      POSTGRES_PASSWORD: campusdesk_secret
      POSTGRES_DB: campusdesk_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusdesk -d campusdesk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campusdesk_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      APP_URL: http://localhost:5000
      DATABASE_URL: postgresql://campusdesk:campusdesk_secret@postgres:5432/campusdesk_db?schema=public
      JWT_SECRET: campusdesk_production_jwt_secret_key_32chars_min
      VAPID_PUBLIC_KEY: BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDzkrxZJjSPOSnfMSC2101MmVC30RE4FTC4m5006_5PU
      VAPID_PRIVATE_KEY: 1wR7_2L-rW56G2oQ_17uX_14l_11O_00l-57G_99l-4
      VAPID_SUBJECT: mailto:admin@campusdesk.edu
      SHOW_SAMPLE_BANNER: "true"
    ports:
      - "5000:5000"

volumes:
  postgres_data:
